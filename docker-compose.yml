services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: vpn_db
      POSTGRES_USER: vpn_api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpn_api -d vpn_db -h localhost"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"

  db_init:
    image: postgres:17
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./migrations/schema.sql:/schema.sql:ro
    command: >
      bash -lc "
        psql -h db -U vpn_api -d vpn_db -f /schema.sql
      "
    restart: "no"

  init_profiles:
    build: ./init_profiles
    restart: "no"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: vpn_db
      DB_USER: vpn_api
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      WATCHER_USERNAME: ${WATCHER_USERNAME}
      WATCHER_EMAIL: ${WATCHER_EMAIL}
      WATCHER_PASSWORD: ${WATCHER_PASSWORD}
      SUPERUSER_USERNAME: ${SUPERUSER_USERNAME}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
    depends_on:
      db_init:
        condition: service_completed_successfully

  api:
    build: ./api
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8081"
      POSTGRES_DB: vpn_db
      POSTGRES_USER: vpn_api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      SECRET_KEY: ${SECRET_KEY}
      XRAY_HOST: ${XRAY_HOST}
      XRAY_CONFIG_TOKEN: ${XRAY_CONFIG_TOKEN}
      XRAY_LISTEN: ${XRAY_LISTEN}
      XRAY_PORT: ${XRAY_PORT}
      XRAY_DEST: ${XRAY_DEST}
      XRAY_SERVER_NAMES: ${XRAY_SERVER_NAMES}
      XRAY_PRIVATE_KEY: ${XRAY_PRIVATE_KEY}
      XRAY_SHORT_IDS: ${XRAY_SHORT_IDS}
    depends_on:
      init_profiles:
        condition: service_completed_successfully
    ports:
      - "8081:8081"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_started

  xray_server:
    build: ./xray_server
    restart: unless-stopped
    ports:
      - "543:543"
    environment:
      API_URL: ${WATCHER_API_URL}
      LOGIN_EMAIL: ${WATCHER_EMAIL}
      LOGIN_PASSWORD: ${WATCHER_PASSWORD}
      POLL_INTERVAL: ${WATCHER_POLL_INTERVAL}
      THRESHOLD_MINUTES: ${WATCHER_THRESHOLD_MINUTES}
      XRAY_CONFIG_PATH: ${WATCHER_XRAY_CONFIG_PATH}
      RESTART_COMMAND: kill $$(cat /tmp/xray.pid)
    volumes:
      - xray_etc:/etc/xray
    depends_on:
      api:
        condition: service_started

volumes:
  pg_data: {}
  xray_state: {}
  xray_etc: {}
